name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Python Bytecode Compilation Check
      run: |
        python -m py_compile main.py country_data.py locales.py ivasms_manager.py

    - name: Lint with Flake8
      run: |
        flake8 --max-line-length=160 --ignore=E501,W503 tests/ scripts/ benchmarks/

    - name: Run Unit Tests
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v

    - name: Run Environment Verification
      run: |
        python scripts/verify_environment.py

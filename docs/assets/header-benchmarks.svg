<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 50" width="100%" height="50" style="background:#0d1117; border-radius:8px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <style>
    @keyframes pulseGreen { 0%, 100% { fill: #3fb950; opacity: 1; } 50% { fill: #2ea043; opacity: 0.35; } }
    @keyframes sweep { 0% { transform: translateX(0); } 100% { transform: translateX(360px); } }
    .pulse-dot { animation: pulseGreen 2s infinite ease-in-out; }
    .frame { stroke: #30363d; stroke-width: 1px; fill: #161b22; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect class="frame" x="1" y="1" width="878" height="48" rx="8" />

  <!-- Telemetry Icon -->
  <g transform="translate(18, 17)">
    <circle cx="8" cy="8" r="5" class="pulse-dot" />
  </g>

  <!-- Title Text -->
  <text x="44" y="31" fill="#f0f6fc" font-size="14" font-weight="700" letter-spacing="0.04em">PERFORMANCE BENCHMARKS &amp; TELEMETRY</text>
  <text x="385" y="31" fill="#8b949e" font-size="12" class="mono">| Hardware Profiling (2026)</text>

  <!-- Right tag -->
  <g transform="translate(730, 16)">
    <rect width="132" height="18" rx="4" fill="#0f351e" stroke="#238636" stroke-width="0.8" />
    <text x="66" y="13" fill="#3fb950" font-size="10" font-weight="700" text-anchor="middle" class="mono">REPRODUCIBLE RUNS</text>
  </g>
</svg>
